[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork"
version = "0.1.0"
description = "Grounded, permission-aware answers over Microsoft 365 documents, as an Azure Functions API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "azure-functions>=1.21",
  "azurefunctions-extensions-http-fastapi>=1.0.1",
  "msal>=1.31",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
azure-openai = ["openai>=1.50", "azure-identity>=1.19"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["groundwork*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
